# =============================================================================
#  R E P S   ·   pager-lang
# =============================================================================
[package]
name    = "pager-lang"
version = "0.2.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Virtual and executable memory management for JIT and runtimes."

# Keywords (5 max)
keywords = ["jit", "memory", "mmap", "executable", "virtualalloc"]

# Categories
categories = ["development-tools", "memory-management", "no-std"]

# Links
homepage      = "https://github.com/jamesgober/pager-lang"
repository    = "https://github.com/jamesgober/pager-lang"
documentation = "https://docs.rs/pager-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "pager_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# Links the standard library. Without it the crate is `#![no_std]` and needs only
# `core`; the OS memory APIs are reached through direct FFI either way, so behavior is
# identical. A target with no operating system cannot satisfy the FFI and will not link.
std = []
# Derives `Serialize` / `Deserialize` for the `Protection` and `PagerError` value types,
# so a region's configuration and failure reasons can cross a serialization boundary.
serde = ["dep:serde"]


# DEPENDENCIES
# #################################
[dependencies]
# Optional, value-type serialization only. Gated behind the `serde` feature; the core
# memory management has no runtime dependencies (see dev/ROADMAP.md).
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"
# Concrete format for the `serde` round-trip test.
serde_json = "1"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
